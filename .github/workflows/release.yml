name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build app
        run: |
          xcodebuild \
            -scheme NotchDeckApp \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate built .app
        id: locate
        run: |
          APP_PATH=$(find DerivedData -name "NotchDeck.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "NotchDeck" \
            -srcfolder "${{ steps.locate.outputs.app_path }}" \
            -ov \
            -format UDZO \
            NotchDeck.dmg

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: NotchDeck.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
